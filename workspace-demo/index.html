<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ศูนย์รวมวิถีชุมชน เขต 8 · ต้นแบบ 3.2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f1;--panel:#fff;--panel2:#f7f9f6;--ink:#17231d;--mute:#5b6a62;--line:#e1e7e0;--line2:#cdd7cc;--accent:#17614a;--accent-ink:#fff;--accent-soft:#e2f1e9;--warn-bg:#fff4d1;--warn-ink:#6b5200;--chip:#eef3ed;--ok-bg:#d9f2e3;--ok-ink:#14532d;--bad:#c0392b;--sh1:0 1px 2px rgba(23,35,29,.06),0 1px 3px rgba(23,35,29,.05);--sh2:0 10px 28px rgba(23,35,29,.14);--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1411;--panel:#18211d;--panel2:#1d2823;--ink:#e8efe9;--mute:#9aaba2;--line:#2a3630;--line2:#384842;--accent:#5fc89b;--accent-ink:#0b1a13;--accent-soft:#1c3a2d;--warn-bg:#3a3110;--warn-ink:#f2dc8c;--chip:#25302a;--ok-bg:#1c4430;--ok-ink:#b8f0cf;--bad:#ff8a7a;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 28px rgba(0,0,0,.55)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans Thai","Sarabun","Leelawadee UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- หัวเว็บ ---------- */
header.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:2600}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#25906c,#0f4a38);display:grid;place-items:center;font-size:20px;box-shadow:var(--sh1)}
.brand h1{font-size:16px;margin:0;font-weight:700;line-height:1.25}
.brand .sub{font-size:11.5px;color:var(--mute)}
.search{position:relative;flex:1;min-width:230px;max-width:560px}
.search input{width:100%;padding:9px 40px 9px 36px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.search input:focus{background:var(--panel);border-color:var(--accent)}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none;font-size:14px}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:inherit;font-size:11px;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:0 6px;background:var(--panel);pointer-events:none}
.sres{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);max-height:72vh;overflow:auto;padding:6px}
.sres h4{margin:8px 10px 2px;font-size:12px;color:var(--mute);font-weight:600}
.sr{display:flex;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;align-items:flex-start}
.sr:hover{background:var(--accent-soft)}
.sr .ic{width:28px;height:28px;border-radius:9px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:14px}
.sr .tt{min-width:0;flex:1}
.sr .tt b{display:block;font-weight:600}
.sr .tt small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr mark,.raw mark{background:#ffe08a;color:#222;border-radius:3px;padding:0 1px}
.sres .more{display:block;width:100%;text-align:center;margin-top:6px;border-style:dashed}
.role{display:flex;align-items:center;gap:6px;background:var(--chip);padding:4px 6px 4px 10px;border-radius:12px;margin-left:auto}
.role b{font-size:12px;color:var(--mute);font-weight:600}
.role select{border:0;background:var(--panel);padding:4px 8px}
/* ---------- แท็บนำทาง ---------- */
nav{display:flex;gap:4px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
nav button{border:0;border-radius:10px;background:transparent;padding:7px 13px;white-space:nowrap;display:flex;gap:6px;align-items:center;color:var(--mute);font-weight:500;transition:background .15s,color .15s}
nav button:hover{background:var(--chip);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav .ni{font-size:15px}
nav .b{min-width:18px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;text-align:center;line-height:18px}
/* ---------- พื้นฐาน ---------- */
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:7px 10px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:6px 13px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
button:hover{background:var(--chip)}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;box-shadow:var(--sh1)}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button.danger{color:var(--bad)}
button.x{border:0;background:var(--chip);width:30px;height:30px;padding:0;border-radius:50%}
button:disabled,input:disabled,textarea:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.grow{flex:1}
#view{flex:1;overflow:auto;padding:18px 16px 40px;animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.wrap{max-width:1000px;margin:0 auto}
.pagehead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
h2{font-size:20px;margin:0 0 4px;font-weight:700}
h3{font-size:14px;margin:18px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h3::before{content:'';width:4px;height:14px;border-radius:2px;background:var(--accent);flex:none}
h3.nb::before{display:none}
.muted{color:var(--mute);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
label.l{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 4px;font-weight:500}
.f{width:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh1);margin:10px 0}
/* ---------- การ์ดข้อมูล ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px 11px 18px;margin:9px 0;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh1);transition:box-shadow .15s,transform .15s,border-color .15s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stripe,var(--line2))}
.card:hover{border-color:var(--line2);box-shadow:var(--sh2);transform:translateY(-1px)}
.card .txt{margin:7px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wi{color:#fff;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.wi.o{background:transparent!important;border:1.5px solid currentColor}
.pill{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:99px;background:var(--chip);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.lk{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 9px;font-size:12px;font-weight:500}
.lk.p{background:#e8e3f7;color:#4a3a8a}
@media (prefers-color-scheme:dark){.lk.p{background:#2e2850;color:#c9bff0}}
.lk button{border:0;background:transparent;padding:0 2px;line-height:1;color:inherit;opacity:.7}
.lk button:hover{opacity:1;background:transparent}
.sugg{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:1px 9px;font-size:12px}
.qt{display:flex;gap:5px;align-items:center;margin-top:8px;flex-wrap:wrap}
.qt button{padding:0 9px;font-size:12px;border-radius:99px;border:1.5px solid var(--line2);background:transparent;min-width:28px}
.qt button.on{color:#fff;border-color:transparent}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--mute);box-shadow:var(--sh1)}
.stat b{display:block;font-size:22px;color:var(--ink);line-height:1.2}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.fc{border:1.5px solid var(--line2);background:var(--panel);border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.fc:hover{border-color:var(--c,var(--accent))}
.fc.on{background:var(--c,var(--accent));color:#fff;border-color:transparent;font-weight:600}
.fc i{font-style:normal;opacity:.75;margin-left:4px;font-size:12px}
.filters{position:sticky;top:-18px;z-index:5;background:var(--bg);padding:8px 0 4px;margin-top:6px}
.tgl{position:relative;display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:2px 11px;margin:0 6px 6px 0;border-radius:99px;border:1.5px solid var(--c);color:var(--c);cursor:pointer;user-select:none;transition:all .15s}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.tgl.on{background:var(--c);color:#fff;font-weight:600}
.tgl.dis{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--mute);padding:34px 10px;border:1.5px dashed var(--line2);border-radius:var(--r);margin:12px 0}
.empty .em{font-size:34px;display:block;margin-bottom:4px}
.kan{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;align-items:start;padding-bottom:6px}
.col{background:var(--chip);border-radius:var(--r);padding:8px 10px 10px;min-height:120px;border-top:4px solid var(--kc,var(--line2))}
.col[data-k=new]{--kc:#2f8fe0}.col[data-k=checked]{--kc:#1b7f5a}.col[data-k=pick]{--kc:#e0a21a}.col[data-k=skip]{--kc:#9aa0a6}
.col h3{margin:6px 4px 6px}
.col h3::before{display:none}
.col .card{cursor:default;margin:8px 0}
.col .card[data-open]{cursor:pointer}
.item{border-top:1px solid var(--line);padding:9px 0;font-size:13.5px}
.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:9px 13px;font-size:13px;margin:10px 0}
.warnbox.soft{background:var(--accent-soft);color:var(--ink)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6a58b5,#3e2f8a);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.prow{display:flex;gap:12px;align-items:center}
.prow .info{flex:1;min-width:0}
/* ---------- แผนที่ ---------- */
#v-map{flex:1;min-height:0;display:none;flex-direction:column}
#mapStats{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line)}
.tile{background:var(--chip);border-radius:12px;padding:6px 13px;min-width:118px;flex:none;font-size:12.5px;color:var(--mute)}
.tile b{font-size:19px;display:block;color:var(--ink);line-height:1.3}
.tile .meter{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:4px}
.tile .meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
#mapBody{flex:1;min-height:0;display:flex}
#map{flex:1;min-width:0}
#mapSide{width:372px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.mapsearch{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.mapsearch input{width:100%;border-radius:10px}
#mapQRes .item{cursor:pointer;padding:6px 4px}
#mapQRes .item:hover{background:var(--accent-soft)}
.mtabs{display:flex;border-bottom:1px solid var(--line)}
.mtabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 4px;font-size:13px;border-bottom:3px solid transparent;color:var(--mute)}
.mtabs button.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:700}
#msBody{padding:12px 14px;overflow:auto;flex:1}
.kind{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13.5px}
.kind .sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.35);flex:none}
.kind .n{margin-left:auto;color:var(--mute);font-size:12px}
.row2{display:flex;gap:8px;margin-top:6px}
.hl{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;line-height:1;border-radius:5px;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 3px;white-space:nowrap;height:18px}
.hl.iv{box-shadow:0 0 0 3px #2ecc71,0 1px 3px rgba(0,0,0,.6)}
.hl.sel{outline:3px solid #ffd23f}
.pl{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.65);font-size:14px}
.pl.sel{outline:3px solid #ffd23f}
.small .hl{font-size:0;padding:0;width:9px!important;height:9px!important}
@media (max-width:820px){#mapBody{flex-direction:column}#mapSide{width:100%;height:48%;border-left:0;border-top:1px solid var(--line)}}
/* ---------- หน้าต่างลอย ---------- */
.modal{position:fixed;inset:0;background:rgba(10,20,15,.55);backdrop-filter:blur(2px);z-index:3000;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
.mp{background:var(--panel);border-radius:18px;max-width:800px;width:100%;padding:0 20px 20px;border:1px solid var(--line);box-shadow:var(--sh2);animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:sticky;top:0;background:var(--panel);z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px;border-radius:18px 18px 0 0}
.raw{white-space:pre-wrap;background:var(--chip);border-radius:12px;padding:11px 13px;font-size:13.5px;max-height:220px;overflow:auto;user-select:text}
.sug{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}
.sug button{margin:4px 6px 0 0;background:var(--panel);font-size:12.5px;padding:2px 10px}
.sug button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:4px 14px}
.toast{position:fixed;z-index:4000;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2a24;color:#fff;padding:10px 16px;border-radius:12px;display:none;font-size:13.5px;max-width:90vw;box-shadow:var(--sh2)}
.toast button{background:transparent;color:#9be7c4;border-color:#4a6b5c}
.hint{position:absolute;z-index:1000;left:50%;transform:translateX(-50%);top:10px;background:var(--warn-bg);color:var(--warn-ink);padding:7px 14px;border-radius:99px;font-size:13px;display:none;gap:8px;align-items:center;box-shadow:var(--sh2)}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ph img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pin{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.leaflet-container{font-family:inherit}
a{color:var(--accent)}
@media (max-width:640px){header.top{padding:8px 12px;gap:8px}.search{order:3;max-width:none;flex-basis:100%}.role{margin-left:0}.brand .sub{display:none}#view{padding:14px 12px 40px}}
.syncst{font-size:12px;color:var(--mute);background:var(--chip);padding:3px 11px;border-radius:99px;white-space:nowrap;margin-left:auto}
.syncst.ok{color:var(--ok-ink);background:var(--ok-bg)}
.syncst.bad{color:var(--warn-ink);background:var(--warn-bg)}
.userchip{font-size:12.5px;background:var(--accent-soft);color:var(--accent);padding:4px 12px;border-radius:99px;font-weight:600;white-space:nowrap}
code{background:var(--chip);padding:1px 6px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🧭</span><div><h1>ศูนย์รวมวิถีชุมชน</h1><div class="sub">เขต 8 บึงสวาง · ต้นแบบ 3.2 · ข้อมูลสมมติ ยังไม่ต่อชีต/Drive</div></div></div>
  <div class="search"><span class="si">🔍</span><input id="gq" type="search" autocomplete="off" placeholder="ค้นหาทุกอย่าง เช่น 21, สมศรี, น้ำท่วม"><kbd>/</kbd><div id="sres" class="sres"></div></div>
  <div id="syncSt" class="syncst" style="display:none"></div>
  <div id="userChip" class="userchip" style="display:none"></div>
  <button id="cfgBtn" class="x" title="เชื่อมต่อ / ตั้งค่า">⚙️</button>
  <div class="role" id="roleBox" title="ของจริงใช้รหัสส่วนตัว สลับตรงนี้เพื่อดูว่าแต่ละบทบาททำอะไรได้">
    <b>ดูในบทบาท</b>
    <select id="roleSel"><option value="admin">ผู้ดูแล (หัวหน้าเขต)</option><option value="lead">หัวหน้าวิถี</option><option value="member">สมาชิก</option><option value="viewer">ผู้ชม</option></select>
    <select id="leadSel"></select>
  </div>
</header>
<nav id="nav"></nav>
<div id="view"></div>
<div id="v-map"><div id="mapStats"></div><div id="mapBody"><div id="map" style="position:relative"></div><div id="mapSide"><div class="mapsearch"><input id="mapQ" type="search" placeholder="🔍 หาบ้านเลขที่หรือชื่อจุดบนแผนที่ เช่น 21" autocomplete="off"><div id="mapQRes"></div></div><div class="mtabs" id="mtabs"></div><div id="msBody"></div></div></div></div>
<div class="modal" id="modal"><div class="mp" id="mbody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ============ ค่าคงที่ (ลำดับวิถีตามรายงานเขต 3/7/9) ============
var C=[16.381806,102.669583];
var WI=[null,'แผนที่เดินดิน','ผังเครือญาติ','โครงสร้างองค์กรชุมชน','ระบบสุขภาพชุมชน','ปฏิทินชุมชน','ประวัติศาสตร์ชุมชน'];
var WC=[null,'#2f8fe0','#b0408f','#1b7f5a','#c97a12','#d03b4f','#7a5bb5'];
var METHODS=['สัมภาษณ์เชิงลึก','สนทนากลุ่ม (FGD)','สังเกตแบบมีส่วนร่วม','ข้อมูลทุติยภูมิ','อื่นๆ'];

 toast(dup?'ปักบ้าน '+no+' แล้ว (เลขที่นี้มีอยู่แล้ว ซ้ำ ดูในรายการ “ต้องตรวจ”)':'ปักบ้าน '+(no||'ไม่มีเลขที่')+' แล้ว');

 feats.forEach(function(f){
  if(f.hidden||!st.fvis[f.kind])return;var k=FK[f.kind],sel=f.id===st.fsel,lay;

   lay.on('dragend',function(e){var p=e.target.getLatLng();f.coords=[p.lat,p.lng];f.hist.push('ย้ายตำแหน่ง · '+me()+' · '+now());save()})}
  else if(k.geom==='line'){lay=L.polyline(f.coords,{color:k.c,weight:sel?7:4,opacity:.9})}
  else{lay=L.polygon(f.coords,{color:k.c,weight:sel?4:2,fillColor:k.c,fillOpacity:k.fill,dashArray:f.kind==='boundary'?'6 5':null})}

function tnorm(s){return String(s==null?'':s).replace(/[๐-๙]/g,function(c){return String(c.charCodeAt(0)-3664)}).toLowerCase()}
function qparse(q){var qn=tnorm(String(q||'').trim());var hq=qn.replace(/^(บ้านเลขที่|บ้านเลข|เลขที่|หลังที่|บ้าน)\s*/,'');return {qn:qn,hq:hq,isNo:/^\d{1,4}(\/\d{1,3})?$/.test(hq)}}
function personOf(id){return people.filter(function(p){return p.id===id})[0]}
function pLive(){return people.filter(function(p){return !p.hidden})}
function addTo(s,k,id,label){s[k]=s[k]||[];if(s[k].indexOf(id)<0){s[k].push(id);s.hist=s.hist||[];s.hist.push('ผูกกับ '+label+' · '+me()+' · '+now())}}
function delFrom(s,k,id,label){s[k]=(s[k]||[]).filter(function(x){return x!==id});s.hist=s.hist||[];s.hist.push('เลิกผูกกับ '+label+' · '+me()+' · '+now())}
function newPerson(name){var p={id:uid('P'),name:String(name).trim(),alias:'',aka:'',house:'',note:'',by:me(),at:now(),hist:['สร้างรายการ · '+me()+' · '+now()],hidden:false};people.push(p);return p}
function featEm(f){return f.kind==='house'?'🏠':(FK[f.kind].i||'📍')}
function featIcon(f){return featEm(f)+' '}
function linkChips(s,rm){var o=[];
 (s.fids||[]).forEach(function(id){var f=featOf(id);if(f&&!f.hidden)o.push('<span class="lk"><span'+(rm?' data-m="gofeat" data-fid="'+id+'" style="cursor:pointer" title="ดูบนแผนที่"':'')+'>'+featIcon(f)+esc(featLabel(f))+'</span>'+(rm?'<button data-m="unlink" data-fid="'+id+'" title="เลิกผูก">✕</button>':'')+'</span>')});
 (s.pids||[]).forEach(function(id){var p=personOf(id);if(p&&!p.hidden)o.push('<span class="lk p"><span'+(rm?' data-m="gop" data-pid="'+id+'" style="cursor:pointer" title="เปิดหน้าบุคคล"':'')+'>👤 '+esc(p.name)+'</span>'+(rm?'<button data-m="punlink" data-pid="'+id+'" title="เลิกผูก">✕</button>':'')+'</span>')});
 return o.join('')}

// ---- ตรวจจับ “พูดถึง” ในข้อความ (เสนอให้ผูก ไม่ผูกให้เอง) ----
var TITLES=['นางสาว','น.ส.','ผู้ใหญ่','กำนัน','หลวงพ่อ','อสม.','นาย','นาง','คุณ','ป้า','ลุง','ยาย','น้า','พ่อ','แม่','พี่','หมอ','ครู','ตา','อา'];
function pClean(x){return String(x||'').replace(/\(.*?\)/g,'').trim()}
function stripTitle(n){for(var i=0;i<TITLES.length;i++){var t=TITLES[i];if(n.indexOf(t)===0&&n.length>t.length+1)return {t:t,rest:n.slice(t.length).trim()}}return {t:'',rest:n}}
var PTC={};
function pTokens(p){var key=p.name+'|'+(p.aka||'');var c=PTC[p.id];if(c&&c.k===key)return c.t;var o={};function add(x){x=pClean(x);if(x.length>=3)o[x]=1}
 var full=pClean(p.name);add(full);var r=stripTitle(full);add(r.rest);var parts=r.rest.split(/\s+/).filter(Boolean);if(parts[0])add(parts[0]);if(parts.length>1)add(parts[parts.length-1]);if(r.t&&parts[0])add(r.t+parts[0]);
 String(p.aka||'').split(/[,،]/).forEach(add);
 var t=Object.keys(o).sort(function(a,b){return b.length-a.length});PTC[p.id]={k:key,t:t};return t}
function housesMentioned(text){var t=tnorm(text),m,o=[];
 /* เขียนชัดว่า “บ้านเลขที่/เลขที่/หลังที่” ถือว่าเป็นเลขที่บ้านแน่ · ส่วน “บ้าน 12” เฉยๆ อาจเป็นจำนวน จึงตัดกรณีตามด้วย หลัง/คน/ร้าน/ปี ฯลฯ */
 var r1=/(?:บ้านเลขที่|บ้านเลข|หลังที่|เลขที่)\s*(\d{1,4}(?:\/\d{1,3})?)(?!\d)/g,r2=/บ้าน\s*(\d{1,4}(?:\/\d{1,3})?)(?!\d)(?!\s*(?:หลัง|คน|ร้าน|ครัว|แห่ง|ไร่|ปี|%|ตัว))/g;
 while((m=r1.exec(t))){if(o.indexOf(m[1])<0)o.push(m[1])}
 while((m=r2.exec(t))){if(o.indexOf(m[1])<0)o.push(m[1])}return o}
function placeHit(f,text){if(f.hidden||f.kind==='house')return false;var n=tnorm(pClean(f.title));return n.length>=4&&tnorm(text).indexOf(n)>=0}
function peopleMentions(text){var t=tnorm(text);return pLive().filter(function(p){return pTokens(p).some(function(k){return t.indexOf(tnorm(k))>=0})})}
function suggest(s){
 var fi=s.fids||[],pi=s.pids||[],r={houses:[],nohouse:[],places:[],people:[]};
 housesMentioned(s.text).forEach(function(no){var hit=feats.filter(function(f){return !f.hidden&&f.kind==='house'&&tnorm(f.no)===no});if(!hit.length)r.nohouse.push(no);hit.forEach(function(f){if(fi.indexOf(f.id)<0)r.houses.push(f)})});
 feats.forEach(function(f){if(placeHit(f,s.text)&&fi.indexOf(f.id)<0)r.places.push(f)});
 peopleMentions(s.text).forEach(function(p){if(pi.indexOf(p.id)<0)r.people.push(p)});
 r.n=r.houses.length+r.places.length+r.people.length;return r}

function featScore(f,qp){if(f.hidden)return 0;var qn=qp.qn;
 if(f.kind==='house'){var no=tnorm(f.no);if(qp.isNo&&no){if(no===qp.hq)return 100;if(no.indexOf(qp.hq)===0)return 60;if(no.indexOf(qp.hq)>=0)return 30}
  if(!qp.isNo&&tnorm(f.note+' '+HS[f.status].t+(f.iv?' สัมภาษณ์แล้ว':'')).indexOf(qn)>=0)return 20;return 0}
 if(tnorm(f.title).indexOf(qn)>=0)return 70;return tnorm(FK[f.kind].t+' '+f.note).indexOf(qn)>=0?25:0}
function personHit(p,qp){if(p.hidden)return false;if(qp.isNo)return !!p.house&&tnorm(p.house)===qp.hq;return tnorm([p.name,p.alias,p.aka,p.note,p.house?'บ้าน '+p.house:''].join(' ')).indexOf(qp.qn)>=0}
function snipSearch(s,qp){var n=noteOf(s),qn=qp.qn,sc=0,why=[],tx=tnorm(s.text);
 if(qp.isNo){if(housesMentioned(s.text).indexOf(qp.hq)>=0)sc=55;else if(tx.indexOf(qp.hq)>=0)sc=25}else if(tx.indexOf(qn)>=0)sc=40;
 if(tnorm([n.informant,n.title,n.by,s.reportName].join(' ')).indexOf(qn)>=0)sc=Math.max(sc,30);
 (s.fids||[]).forEach(function(id){var f=featOf(id);if(!f||f.hidden)return;var hit=f.kind==='house'?(qp.isNo?tnorm(f.no)===qp.hq:tnorm(f.no).indexOf(qn)>=0):tnorm(featLabel(f)+' '+f.note).indexOf(qn)>=0;if(hit){sc=Math.max(sc,50);why.push(featIcon(f)+featLabel(f))}});
 (s.pids||[]).forEach(function(id){var p=personOf(id);if(p&&personHit(p,qp)){sc=Math.max(sc,50);why.push('👤 '+p.name)}});
 return sc?{s:s,sc:sc,why:why}:null}
function excerpt(text,qp){var t=tnorm(text),k=(qp.isNo&&t.indexOf(qp.hq)>=0)?qp.hq:qp.qn,i=t.indexOf(k);if(i<0)return esc(text.slice(0,90)+(text.length>90?'…':''));var a=Math.max(0,i-28),b=Math.min(text.length,i+k.length+60);return (a?'…':'')+esc(text.slice(a,i))+'<mark>'+esc(text.slice(i,i+k.length))+'</mark>'+esc(text.slice(i+k.length,b))+(b<text.length?'…':'')}
function renderSearch(q){var qp=qparse(q);if(!qp.qn)return '';
 var F=feats.map(function(f){return {f:f,sc:featScore(f,qp)}}).filter(function(x){return x.sc>0}).sort(function(a,b){return b.sc-a.sc});
 var P=pLive().filter(function(p){return personHit(p,qp)});
 var S=snips.map(function(s){return snipSearch(s,qp)}).filter(Boolean).sort(function(a,b){return b.sc-a.sc});
 var h='';
 if(F.length)h+='<h4>🏠 บ้านและจุดบนแผนที่ ('+F.length+')</h4>'+F.slice(0,6).map(function(x){var f=x.f;return '<div class="sr" data-sr="f|'+f.id+'"><span class="ic">'+featEm(f)+'</span><div class="tt"><b>'+esc(featLabel(f))+'</b><small>'+esc(f.kind==='house'?HS[f.status].t+(f.iv?' · สัมภาษณ์แล้ว':''):FK[f.kind].t)+(f.note?' · '+esc(f.note):'')+'</small></div></div>'}).join('')+(F.length>6?'<div class="muted" style="padding:0 10px 4px">…อีก '+(F.length-6)+' รายการ พิมพ์ให้เจาะจงขึ้น</div>':'');
 if(P.length)h+='<h4>👥 บุคคล ('+P.length+')</h4>'+P.slice(0,5).map(function(p){var cnt=snips.filter(function(s){return (s.pids||[]).indexOf(p.id)>=0}).length;return '<div class="sr" data-sr="p|'+p.id+'"><span class="ic">👤</span><div class="tt"><b>'+esc(p.name)+(p.alias?' <span class="muted">('+esc(p.alias)+')</span>':'')+'</b><small>'+(p.house?'บ้านเลขที่ '+esc(p.house)+' · ':'')+cnt+' ข้อความที่ผูกไว้'+(p.note?' · '+esc(p.note):'')+'</small></div></div>'}).join('');
 if(S.length)h+='<h4>📝 ข้อความ ('+S.length+')</h4>'+S.slice(0,6).map(function(x){var s=x.s;return '<div class="sr" data-sr="s|'+s.id+'"><span class="ic">📝</span><div class="tt"><b style="font-weight:500;white-space:normal">'+excerpt(s.text,qp)+'</b><small>'+(x.why.length?'ผูกกับ '+x.why.map(esc).join(', ')+' · ':'')+esc(noteOf(s).by)+(s.wi.length?' · วิถี '+s.wi.join(','):' · ยังไม่ระบุวิถี')+'</small></div></div>'}).join('')+'<button class="more" data-sr="all|">ดูทั้ง '+S.length+' ข้อความในคลังกลาง</button>';
 if(!h)h='<div class="empty" style="margin:6px;padding:18px"><span class="em">🔎</span>ไม่พบ “'+esc(q)+'”</div>';
 return h}

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function maskText(t){var rules=[];pLive().forEach(function(p){pTokens(p).forEach(function(k){rules.push([k,p.alias||'[ยังไม่ตั้งตัวย่อ]'])})});rules.sort(function(a,b){return b[0].length-a[0].length});rules.forEach(function(r){t=t.replace(new RegExp(escRe(r[0]),'gi'),function(){return r[1]})});return t}
function noAlias(list){var o={};list.forEach(function(s){peopleMentions(s.text).forEach(function(p){if(!p.alias)o[p.id]=p})});return Object.keys(o).map(function(k){return o[k]})}

var T4=['notes','snips','people','feats'];
function arr(t){return t==='notes'?notes:t==='snips'?snips:t==='people'?people:feats}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h}
var PHC={},PHL={},BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function imgTag(p){if(String(p).indexOf('drive:')!==0)return '<img src="'+p+'" alt="รูป">';var c=PHC[p];if(!c)loadPhoto(p);return '<img data-ph="'+esc(p)+'" src="'+(c||BLANK)+'" alt="รูป">'}
function loadPhoto(p){if(PHL[p]||!SYNC_ON)return;PHL[p]=1;
 api('photo',{id:p.slice(6)}).then(function(r){if(r.ok){PHC[p]='data:'+r.mime+';base64,'+r.b64;[].forEach.call(document.querySelectorAll('img[data-ph]'),function(im){if(im.dataset.ph===p)im.src=PHC[p]})}else PHL[p]=0},function(){PHL[p]=0})}

async function apiTo(url,code,action,payload){
 var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},45000);
 try{var res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action,code:code},payload||{})),signal:ctl.signal});return await res.json()}
 finally{clearTimeout(tm)}}
function api(action,payload){return apiTo(CFG.api,CFG.code,action,payload)}

function dirtyList(){var out=[];T4.forEach(function(t){arr(t).forEach(function(r){var j=JSON.stringify(r);if(SY.snap[t+':'+r.id]!==hash(j))out.push({t:t,id:r.id,r:r})})});return out}
function adopt(t,id,json){var o=JSON.parse(json),a=arr(t),i=-1;a.forEach(function(x,n){if(x.id===id)i=n});if(i>=0)a[i]=o;else a.push(o);SY.snap[t+':'+id]=hash(JSON.stringify(o))}
function adoptIfClean(t,r){var k=t+':'+r.id,loc=arr(t).filter(function(x){return x.id===r.id})[0];
 if(loc&&SY.snap[k]!==hash(JSON.stringify(loc)))return false;   // มีแก้ในเครื่องที่ยังไม่ส่ง · รอบส่งหน้าจะชนกับของเซิร์ฟเวอร์แล้วแจ้งเตือน
 if(loc&&SY.rev[k]===r.rev)return false;
 adopt(t,r.id,r.json);SY.rev[k]=r.rev;return true}
async function uploadPhotos(x){var ph=x.r.photos;if(!ph)return;
 for(var i=0;i<ph.length;i++){if(String(ph[i]).indexOf('data:')===0){var m=/^data:([\w\/+.-]+);base64,(.+)$/.exec(ph[i]);if(!m)throw new Error('รูปเสียหาย');var r=await api('uploadPhoto',{mime:m[1],b64:m[2]});if(!r.ok)throw new Error(r.error||'อัปโหลดรูปไม่สำเร็จ');PHC['drive:'+r.id]=ph[i];ph[i]='drive:'+r.id}}}

function updateSyncUI(){var e=$('syncSt');if(!e||!SYNC_ON)return;e.style.display='';var t='';
 if(SY.state==='sending')t='⟳ กำลังซิงค์…';
 else if(SY.state==='dirty')t='● รอส่ง…';
 else if(SY.state==='ok')t='✓ ซิงค์แล้ว '+new Date(SY.lastOk).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
 else if(SY.state==='offline')t='○ ออฟไลน์ · รอส่ง '+dirtyList().length;
 else if(SY.state==='auth')t='⚠ รหัสไม่ถูกต้อง';
 else t='⚠ '+(SY.err||'ผิดพลาด');

async function syncNow(){
 if(!SYNC_ON||SY.busy)return;SY.busy=true;setState('sending');var changed=false;
 try{
  var d=dirtyList();
  for(var off=0;off<d.length;off+=25){
   var part=d.slice(off,off+25);
   for(var i=0;i<part.length;i++){if(part[i].t==='notes'||part[i].t==='feats')await uploadPhotos(part[i])}
   part.forEach(function(x){x.h=hash(JSON.stringify(x.r))});
   var res=await api('push',{changes:part.map(function(x){return {t:x.t,id:x.id,base:SY.rev[x.t+':'+x.id]||0,data:x.r}})});
   if(!res.ok){if(res.code==='auth'){setState('auth');return}throw new Error(res.error||'ส่งไม่สำเร็จ')}
   var conflicts=0,bad=[];
   res.results.forEach(function(r,i){var x=part[i],k=r.t+':'+r.id;
    if(r.status==='ok'){SY.rev[k]=r.rev;if(r.json){adopt(r.t,r.id,r.json);changed=true}else SY.snap[k]=x.h}
    else if(r.status==='conflict'){adopt(r.t,r.id,r.json);SY.rev[k]=r.rev;conflicts++;changed=true}
    else{SY.snap[k]=x.h;bad.push(r.error||r.status)}});
   if(conflicts)toast('มีคนแก้ข้อมูล '+conflicts+' รายการพร้อมกับคุณ ระบบใช้ฉบับล่าสุดของเซิร์ฟเวอร์ ลองแก้อีกครั้งถ้าจำเป็น');
   if(bad.length)toast('ส่งบางรายการไม่ได้: '+bad[0])}
  var pr=await api('pull',{since:SY.since});
  if(!pr.ok){if(pr.code==='auth'){setState('auth');return}throw new Error(pr.error||'ดึงข้อมูลไม่สำเร็จ')}
  T4.forEach(function(t){(pr.recs[t]||[]).forEach(function(r){if(adoptIfClean(t,r))changed=true})});
  SY.since=pr.now;SY.lastOk=Date.now();persist();setState('ok');if(changed)softRefresh();
 }catch(e){setState(navigator.onLine?'err':'offline',e&&e.message)}
 finally{SY.busy=false}}

 if($('mbody').dataset.kind!=='c')return;var b=e.target.closest('[data-cm]');if(!b)return;var a=b.dataset.cm;
 if(a==='close')return closeModal();
 if(a==='connect'){var url=$('cApi').value.trim(),code=$('cCode').value.trim();if(!/^https:\/\/script\.google\.com\//.test(url)&&!/^http:\/\/localhost/.test(url))return $('cMsg').textContent='ที่อยู่ต้องขึ้นต้นด้วย https://script.google.com/';if(!code)return $('cMsg').textContent='ใส่รหัสก่อน';
  $('cMsg').textContent='กำลังตรวจสอบ…';try{var r=await apiTo(url,code,'login');if(!r.ok){$('cMsg').textContent=r.error||'ไม่สำเร็จ';return}
   localStorage.setItem('commed_ws_cfg',JSON.stringify({api:url,code:code,user:{name:r.name,role:r.role,wi:r.wi}}));location.href=location.pathname}catch(er){$('cMsg').textContent='เชื่อมต่อไม่ได้: '+er.message}return}
 if(a==='sync'){closeModal();return syncNow()}
 if(a==='logout'){try{localStorage.removeItem('commed_ws_cfg');localStorage.removeItem('commed_ws_data');localStorage.removeItem('commed_ws_survey')}catch(er){}location.reload();return}
 if(a==='addcode'){var nm=$('cNm').value.trim(),role=$('cRole').value;var r2=await api('addCode',{name:nm,role:role,wi:role==='lead'?+$('cWi').value:0});
  if(!r2.ok){toast(r2.error||'สร้างไม่ได้');return}$('cNew').innerHTML='<div class="warnbox soft">รหัสใหม่ของ <b>'+esc(nm)+'</b>: <code style="font-size:16px;user-select:all">'+esc(r2.code)+'</code><br><span class="muted">ส่งให้เจ้าของรหัสทางส่วนตัว (ไม่โพสต์ในกลุ่มสาธารณะ)</span></div>';$('cNm').value='';loadCodes();return}
 if(a==='revoke'){var r3=await api('revokeCode',{target:b.dataset.code});if(!r3.ok){toast(r3.error||'ลบไม่ได้');return}toast('ลบรหัสแล้ว');loadCodes();return}
 if(a==='svsave'){localStorage.setItem('commed_ws_survey',JSON.stringify({api:$('sApi').value.trim(),team:$('sTeam').value.trim(),moo:$('sMoo').value.trim()||'11'}));$('sMsg').textContent='บันทึกแล้ว';return}
 if(a==='svtest'){localStorage.setItem('commed_ws_survey',JSON.stringify({api:$('sApi').value.trim(),team:$('sTeam').value.trim(),moo:$('sMoo').value.trim()||'11'}));$('sMsg').textContent='กำลังทดสอบ…';
  try{var s=await svCall({action:'house',moo:'',no:''});$('sMsg').textContent=s.ok?'เชื่อมได้ · ตอนนี้มี '+s.total.people+' ชุด จาก '+s.total.houses+' หลัง':(s.error||'ไม่สำเร็จ')}catch(er){$('sMsg').textContent='เชื่อมไม่ได้: '+er.message}}});

// ---- แบบสอบถาม (อ่านอย่างเดียว ใช้คำสั่ง house ที่มีอยู่แล้ว ไม่แก้ฝั่งแบบสอบถาม) ----
async function svCall(payload){var s=SVget();if(!s.api||!s.team)throw new Error('ยังไม่ได้ตั้งค่าการเชื่อมแบบสอบถาม');
 var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},45000);
 try{var r=await fetch(s.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:s.team},payload)),signal:ctl.signal});return await r.json()}finally{clearTimeout(tm)}}
function svOn(){var s=SVget();return SYNC_ON&&!!(s.api&&s.team)}
function svHouse(no){return svCall({action:'house',moo:String(SVget().moo||'11'),no:no})}
var SVT={at:0,d:null};
async function svTile(){if(!svOn())return;var el=$('svTile');if(!el)return;
 try{if(!SVT.d||Date.now()-SVT.at>300000){var r=await svCall({action:'house',moo:'',no:''});if(!r.ok)throw new Error(r.error);SVT={at:Date.now(),d:r.total}}
  el=$('svTile');if(el)el.innerHTML='<b>'+SVT.d.houses+' หลัง</b>แบบสอบถามจริง · '+SVT.d.people+' ชุด'}catch(e){el=$('svTile');if(el)el.innerHTML='<b style="font-size:13px">แบบสอบถาม</b>'+esc(e.message||'ดึงไม่ได้')}}
function svRows(sets){return sets.map(function(s){return '<div class="item">'+esc(s.date||s.t||'')+' · '+(s.sex==='1'?'ชาย':s.sex==='2'?'หญิง':esc(s.sex||'?'))+' อายุ '+esc(s.age||'?')+' · '+esc(s.by||'')+' '+esc(s.fac||'')+'</div>'}).join('')}

// ============ เริ่มต้น ============
$('leadSel').innerHTML=[1,2,3,4,5,6].map(function(n){return '<option value="'+n+'">วิถี '+n+' '+WI[n]+'</option>'}).join('');
$('roleSel').value=st.role;$('leadSel').value=st.lead;$('leadSel').style.display=st.role==='lead'?'':'none';
function roleChange(){st.role=$('roleSel').value;st.lead=+$('leadSel').value;$('leadSel').style.display=st.role==='lead'?'':'none';render()}
$('roleSel').onchange=roleChange;$('leadSel').onchange=roleChange;
if(SYNC_ON)applyUser();
render();
if(SYNC_ON)syncInit();
</script>
